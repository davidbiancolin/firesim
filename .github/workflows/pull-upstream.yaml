name: pull-upstream

on:
    #schedule:
    #sc- cron: "0 0 * * WED, SAT"
  pull_request:
    branches:
      - test

env:
  PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_A_PERSONAL_ACCESS_TOKEN }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  createPullRequest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
            ref: 'main'
            token: ${{ env.GITHUB_TOKEN }}

      - name: Detect upstream changes
        id: check_upstream
        run: |
          git remote add upstream https://github.com/firesim/firesim.git
          git fetch --recurse-submodules=no upstream main
          git merge-base --is-ancestor upstream/main HEAD || echo $?
          echo "new_merges=$(git merge-base --is-ancestor upstream/main HEAD || echo $?)" >> $GITHUB_OUTPUT
          # https://github.com/orgs/community/discussions/26288#discussioncomment-3876281
          delimiter="$(openssl rand -hex 8)"
          echo "git_log<<${delimiter}" >> "${GITHUB_OUTPUT}"
          echo "$(git log $(git merge-base upstream/main HEAD)..upstream/main)" >> "${GITHUB_OUTPUT}"
          echo "${delimiter}" >> "${GITHUB_OUTPUT}"

      - name: Attempt merge of upstream/main
        if: ${{ steps.check_upstream.outputs.new_merges != '0' }}
        run: |
          git merge upstream/main

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v4
        with:
          token: ${{ env.GITHUB_TOKEN }}
          commit-message: Update report
          committer: GitHub <noreply@github.com>
          author: ${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>
          signoff: false
          branch: example-patches
          base: main
          delete-branch: true
          title: 'Automatic merge of main from upstream firesim'
          body: |
            Git log of new merges follows.
            ${{ steps.check_upstream.outputs.git_log }}

            - Auto-generated by [create-pull-request][1]
            [1]: https://github.com/peter-evans/create-pull-request
          labels:
          assignees: davidbiancolin
          reviewers: davidbiancolin
          team-reviewers:
          draft: false
